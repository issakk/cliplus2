name: rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # Write, not read: the build publishes the exe as a release, which is the only
  # thing in this workflow that touches the repository.
  contents: write

env:
  # Forced colour puts ANSI escapes into the captured log, which both breaks the
  # diagnostic parser below and makes the log unreadable on its own.
  CARGO_TERM_COLOR: never
  # Statically link the MSVC CRT so the exe runs on a clean Windows install
  # with no Visual C++ redistributable. That is the whole point of this port,
  # and it is a link-time decision, so it cannot be verified locally.
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  rust-build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # The tests cover the SQLite layer, which is the only part of the storage
      # that a reviewer cannot check by reading a diff. They share the build log
      # so a failure lands in the same round of annotations.
      - name: Test and build
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee "$RUNNER_TEMP/build.log"
          cargo build --release 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Workflow-run logs need repo admin to download, but check-run annotations
      # are public. rustc's output is not in the annotation format GitHub wants,
      # so translate it here. The tail fallback exists so a
      # failing build can never be invisible just because the parse missed.
      - name: Surface rustc diagnostics
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"

          if ! command -v python >/dev/null 2>&1; then
            echo "::warning::python unavailable; falling back to raw grep"
            grep -nE '^(error|warning)' "$LOG" | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 0
          fi

          python - "$LOG" <<'PY'
          import io
          import re
          import sys

          def escape(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", " ")

          path = sys.argv[1]
          try:
              raw = io.open(path, encoding="utf-8", errors="replace").read()
          except OSError as err:
              print(f"::error::build log unreadable: {escape(str(err))}")
              raise SystemExit(0)

          log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", raw)

          pattern = re.compile(
              r"^(?P<lvl>error|warning)(?:\[[^\]]+\])?: (?P<msg>.+?)\n"
              r"\s*-->\s*(?P<file>[^\s:]+):(?P<line>\d+):(?P<col>\d+)",
              re.M,
          )

          seen = set()
          for match in pattern.finditer(log):
              level = "error" if match["lvl"] == "error" else "warning"
              key = (level, match["file"], match["line"], match["msg"])
              if key in seen:
                  continue
              seen.add(key)
              print(
                  "::{} file={},line={},col={}::{}".format(
                      level,
                      escape(match["file"]),
                      match["line"],
                      match["col"],
                      escape(match["msg"]),
                  )
              )

          if not seen:
              # This step runs on success too, so an empty parse is the normal
              # outcome for a clean build. Only dump the tail when the log
              # actually contains a failure, otherwise every green build would
              # be decorated with a dozen fabricated "errors".
              if re.search(r"^error", log, re.M) or "could not compile" in log:
                  lines = [line for line in log.strip().splitlines() if line.strip()]
                  for line in lines[-25:]:
                      print(f"::error::log| {escape(line[:400])}")
              else:
                  print("::notice::rust build reported no diagnostics")
          PY

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ClipPlus-win-x64
          path: rust/target/release/ClipPlus.exe
          if-no-files-found: error
          retention-days: 30

      # The artifact above needs a login and a trip through the run page. The
      # release is the file someone actually wants, at a URL that never changes:
      #   https://github.com/<repo>/releases/latest/download/ClipPlus.exe
      # Recreated rather than updated so the `latest` tag names the commit the exe
      # was built from.
      - name: Publish the release
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi

          gh release create latest target/release/ClipPlus.exe \
            --target "${{ github.sha }}" \
            --title "ClipPlus 最新构建" \
            --notes "main 分支最新一次构建 · commit ${{ github.sha }}"

          echo "### [下载 ClipPlus.exe](https://github.com/${{ github.repository }}/releases/latest/download/ClipPlus.exe)" >> "$GITHUB_STEP_SUMMARY"
