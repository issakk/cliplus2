name: rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Forced colour puts ANSI escapes into the captured log, which both breaks the
  # diagnostic parser below and makes the log unreadable on its own.
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Workflow-run logs need repo admin to download, but check-run annotations
      # are public. rustc does not emit GitHub-format diagnostics the way the
      # .NET SDK does, so translate them here. The tail fallback exists so a
      # failing build can never be invisible just because the parse missed.
      - name: Surface rustc diagnostics
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"

          if ! command -v python >/dev/null 2>&1; then
            echo "::warning::python unavailable; falling back to raw grep"
            grep -nE '^(error|warning)' "$LOG" | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 0
          fi

          python - "$LOG" <<'PY'
          import io
          import re
          import sys

          def escape(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", " ")

          path = sys.argv[1]
          try:
              raw = io.open(path, encoding="utf-8", errors="replace").read()
          except OSError as err:
              print(f"::error::build log unreadable: {escape(str(err))}")
              raise SystemExit(0)

          log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", raw)

          pattern = re.compile(
              r"^(?P<lvl>error|warning)(?:\[[^\]]+\])?: (?P<msg>.+?)\n"
              r"\s*-->\s*(?P<file>[^\s:]+):(?P<line>\d+):(?P<col>\d+)",
              re.M,
          )

          seen = set()
          for match in pattern.finditer(log):
              level = "error" if match["lvl"] == "error" else "warning"
              key = (level, match["file"], match["line"], match["msg"])
              if key in seen:
                  continue
              seen.add(key)
              print(
                  "::{} file={},line={},col={}::{}".format(
                      level,
                      escape(match["file"]),
                      match["line"],
                      match["col"],
                      escape(match["msg"]),
                  )
              )

          if not seen:
              lines = [line for line in log.strip().splitlines() if line.strip()]
              for line in lines[-25:]:
                  print(f"::error::log| {escape(line[:400])}")
          PY

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClipPlus-rs-win-x64
          path: rust/target/release/ClipPlus.exe
          if-no-files-found: error
          retention-days: 30
