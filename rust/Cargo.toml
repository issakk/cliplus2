[package]
name = "clipplus"
version = "0.2.0"
edition = "2021"
description = "Windows clipboard history that syncs through any folder-based sync service"
license = "MIT"

[[bin]]
name = "ClipPlus"
path = "src/main.rs"

# Win32 is hand-declared in src/win.rs rather than pulled from windows-sys.
# Those declarations are already known to work and are short enough to read; a
# dependency would mean guessing at version and feature names instead.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
notify = "8"
# `bundled` compiles SQLite from source at build time, so the exe does not
# depend on a sqlite3.dll the user would have to have.
rusqlite = { version = "0.40", features = ["bundled"] }

# The GPUI shell (Zed's framework, GPUI 2 preview line). The popup is GPUI;
# the three secondary dialogs (settings/cleanup/edit) remain Win32 on the same
# thread, pumped by gpui's GetMessageW loop. windows-manifest is off on
# purpose: build.rs embeds the very same manifest once, and two RT_MANIFEST
# resources in one exe is a linker argument waiting to happen.
# flume carries events from the platform/thumbnail/hydrate/edit threads into
# async tasks on the UI thread — its async recv is what wakes gpui's loop.
# raw_window_handle bridges to the popup HWND for the window management calls
# gpui does not expose (show/hide/move/resize on demand).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
image = "0.25"
flume = "0.11"
raw-window-handle = "0.6"

# The icon resource needs the platform resource compiler; this crate shells out
# to rc.exe, which ships with the MSVC toolchain the build already requires.
# See build.rs — the running process does not read the resource, only the exe's
# file icon in Explorer comes from it.
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
