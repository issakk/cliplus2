[package]
name = "clipplus"
version = "0.2.0"
edition = "2021"
description = "Windows clipboard history that syncs through any folder-based sync service"
license = "MIT"

[[bin]]
name = "ClipPlus"
path = "src/main.rs"

# Win32 is hand-declared in src/win.rs rather than pulled from windows-sys.
# Those declarations are already known to work and are short enough to read; a
# dependency would mean guessing at version and feature names instead.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
notify = "8"
# `bundled` compiles SQLite from source at build time, so the exe does not
# depend on a sqlite3.dll the user would have to have.
rusqlite = { version = "0.40", features = ["bundled"] }

# The egui shell (CLIPPLUS_UI=egui). glow is the smallest GPU backend; the
# Microsoft YaHei font loads from the system at runtime rather than being
# packed into the exe. This is the Phase-1 migration path to replacing the
# hand-drawn Win32 popup; the legacy UI stays the default for now.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"

# The icon resource needs the platform resource compiler; this crate shells out
# to rc.exe, which ships with the MSVC toolchain the build already requires.
# See build.rs — the running process does not read the resource, only the exe's
# file icon in Explorer comes from it.
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
