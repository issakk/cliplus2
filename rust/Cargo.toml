[package]
name = "clipplus"
version = "0.2.0"
edition = "2021"
description = "Windows clipboard history that syncs through any folder-based sync service"
license = "MIT"

[[bin]]
name = "ClipPlus"
path = "src/main.rs"

# Win32 is hand-declared in src/win.rs rather than pulled from windows-sys.
# The declarations are a mechanical port of the already-working C# Native.cs,
# so there is exactly one verified reference for every signature instead of a
# dependency whose version and feature names have to be guessed blind.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
notify = "8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
